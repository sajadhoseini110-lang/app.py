<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; display: flex; justify-content: center; background: #f0f2f6; font-family: sans-serif; }
        .grid { display: grid; gap: 10px; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .node {
            width: 40px; height: 40px; border-radius: 50%;
            background: #d1d5db; border: 2px solid #9ca3af;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 12px; color: #4b5563; user-select: none;
            transition: all 0.2s;
        }
        .node.active { background: #3b82f6; border-color: #2563eb; color: white; transform: scale(1.1); }
        .controls { margin-top: 15px; text-align: center; }
        button { padding: 8px 16px; background: #ef4444; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div>
        <div id="grid" class="grid"></div>
        <div class="controls">
            <button onclick="clearSelection()">پاک کردن انتخاب‌ها</button>
        </div>
    </div>

    <script>
        let selectedNodes = [];
        const cols = 4;
        const rows = 4;
        const gridElement = document.getElementById('grid');
        
        // ساخت شبکه
        gridElement.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const node = document.createElement('div');
                node.className = 'node';
                node.dataset.id = `${c},${r}`;
                node.innerText = `${c+1},${r+1}`;
                node.onclick = () => toggleNode(node);
                gridElement.appendChild(node);
            }
        }

        function toggleNode(node) {
            const id = node.dataset.id;
            if (selectedNodes.includes(id)) {
                selectedNodes = selectedNodes.filter(n => n !== id);
                node.classList.remove('active');
            } else {
                selectedNodes.push(id);
                node.classList.add('active');
            }
            // ارسال داده‌ها به Streamlit
            window.parent.postMessage({
                isStreamlitMessage: true,
                type: "streamlit:setComponentValue",
                value: selectedNodes
            }, "*");
        }

        function clearSelection() {
            selectedNodes = [];
            document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
            window.parent.postMessage({
                isStreamlitMessage: true,
                type: "streamlit:setComponentValue",
                value: selectedNodes
            }, "*");
        }
    </script>
</body>
</html>
